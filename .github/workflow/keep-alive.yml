name: Keep Backend Awake

on:
  schedule:
    # Runs every 10 minutes. Render's free tier sleeps after 15 minutes
    # of inactivity, so 10 keeps a safe margin.
    - cron: '*/10 * * * *'
  workflow_dispatch: # allows manual triggering from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://jaarcbackend.onrender.com/api/v1/health)
          echo "Health check responded with status: $response"
          if [ "$response" -ne 200 ]; then
            echo "Warning: health check did not return 200"
            exit 1
          fi